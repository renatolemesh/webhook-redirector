<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Webhook Redirector</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .login-wrap {
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--text);
            font-weight: 600;
        }
        .error {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <span class="brand__mark">W</span>
            <span>Webhook Redirector</span>
        </div>
        <div class="card">
            <div class="card__header">
                <h2>Sign in</h2>
                <small>Admin only</small>
            </div>
            <div class="card__body">
                <div id="errorMsg" class="error">Invalid credentials</div>
                <form id="loginForm">
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" autocomplete="username" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn--primary" style="width:100%;" type="submit">Sign in</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = 'Invalid credentials';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
